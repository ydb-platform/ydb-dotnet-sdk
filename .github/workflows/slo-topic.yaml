name: SLO YDB Topics

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

jobs:
  ydb-slo-topic-action:
    if: contains(github.event.pull_request.labels.*.name, 'SLO')
    name: SLO Topic test
    runs-on: "large-runner-dotnet-sdk"

    permissions:
      contents: read

    steps:
      - name: Install dependencies
        run: |
          YQ_VERSION=v4.48.2
          BUILDX_VERSION=0.30.1
          COMPOSE_VERSION=2.40.3

          sudo curl -L https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64 -o /usr/local/bin/yq && \
            sudo chmod +x /usr/local/bin/yq

          echo "Updating Docker plugins..."
          sudo mkdir -p /usr/local/lib/docker/cli-plugins

          echo "Installing Docker Buildx ${BUILDX_VERSION}..."
          sudo curl -fLo /usr/local/lib/docker/cli-plugins/docker-buildx \
            "https://github.com/docker/buildx/releases/download/v${BUILDX_VERSION}/buildx-v${BUILDX_VERSION}.linux-amd64"
          sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx

          echo "Installing Docker Compose ${COMPOSE_VERSION}..."
          sudo curl -fLo /usr/local/lib/docker/cli-plugins/docker-compose \
            "https://github.com/docker/compose/releases/download/v${COMPOSE_VERSION}/docker-compose-linux-x86_64"
          sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

          echo "Installed versions:"
          yq --version
          docker --version
          docker buildx version
          docker compose version

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          path: current
          fetch-depth: 0

      - name: Build current workload image
        run: |
          set -euxo pipefail
          chmod +x current/.github/scripts/build-slo-image.sh

          current/.github/scripts/build-slo-image.sh \
            --tag "ydb-app-current" \
            --context "$GITHUB_WORKSPACE/current" \
            --workload "TopicService"

      - name: Run YDB SLO Topic
        uses: ydb-platform/ydb-slo-action/init@v3
        timeout-minutes: 30
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workload_name: "Topic-write-read-commit"
          workload_duration: ${{ inputs.slo_workload_duration_seconds || '600' }}
          workload_current_ref: ${{ github.head_ref || github.ref_name }}
          workload_current_image: ydb-app-current
          workload_current_command: run "Host=ydb;Port=2136;Database=/Root/testdb"
          fail_on_workload_error: true
          disable_compose_profiles: workload-baseline

  report:
    name: Topic SLO graphs
    needs: ydb-slo-topic-action
    if: ${{ !cancelled() && needs.ydb-slo-topic-action.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: ydb-platform/ydb-slo-action/report@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          post_comment: false
          github_run_id: ${{ github.run_id }}
      - name: Topic SLO run summary
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          RESULT: ${{ needs.ydb-slo-topic-action.result }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          run_url="$SERVER_URL/$REPO/actions/runs/$RUN_ID"
          report_id=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "Topic-write-read-commit-report.html" and .expired == false)] | max_by(.created_at) | .id // empty')
          report="Unavailable"
          if [ -n "$report_id" ]; then
            report="[Graphs]($run_url/artifacts/$report_id)"
          fi
          {
            printf '## Topic SLO runs\n\n'
            printf '| Run | Result | Commit | Graphs |\n'
            printf '| --- | --- | --- | --- |\n'
            printf '| [#%s.%s](%s) | %s | [%s](%s/%s/commit/%s) | %s |\n' \
              "$RUN_ID" "$RUN_ATTEMPT" "$run_url" "$RESULT" "${COMMIT:0:7}" \
              "$SERVER_URL" "$REPO" "$COMMIT" "$report"
          } >> "$GITHUB_STEP_SUMMARY"
