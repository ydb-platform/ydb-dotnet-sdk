name: SLO final-error QA

on:
  push:
    branches:
      - qa/slo-final-error-20261012/**

permissions:
  contents: read
  pull-requests: read

jobs:
  workload:
    name: Gate (${{ matrix.sdk.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        sdk:
          - name: AdoNet
            workload: AdoNet
          - name: Dapper
            workload: Dapper
          - name: EF
            workload: EF
          - name: Linq2db
            workload: Linq2db
          - name: Topic-write-read-commit
            workload: TopicService
    concurrency:
      group: final-error-${{ github.ref }}-${{ matrix.sdk.name }}
      cancel-in-progress: false
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v5
        with:
          path: current

      - name: Install infrastructure tools
        shell: bash
        run: |
          set -euo pipefail
          sudo curl -fLo /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.48.2/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version
          sudo mkdir -p /usr/local/lib/docker/cli-plugins
          sudo curl -fLo /usr/local/lib/docker/cli-plugins/docker-compose \
            https://github.com/docker/compose/releases/download/v2.40.3/docker-compose-linux-x86_64
          sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          docker compose version

      - name: Set up workload builder
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: v0.30.1
          use: false

      - name: Build actual workload
        uses: docker/build-push-action@v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: current
          file: current/slo/src/${{ matrix.sdk.workload }}/Dockerfile
          platforms: linux/amd64
          tags: ydb-app-current
          load: true
          cache-from: type=gha,scope=final-error-dotnet-${{ matrix.sdk.workload }}
          cache-to: type=gha,mode=max,scope=final-error-dotnet-${{ matrix.sdk.workload }}

      - name: Enable temporary final-error injection
        shell: bash
        run: |
          set -euo pipefail
          docker tag ydb-app-current ydb-app-qa-source
          printf 'FROM ydb-app-qa-source\nENV SLO_QA_FINAL_ERROR=1\n' |
            docker build -t ydb-app-current -

      - name: Run actual workload process gate
        uses: ydb-platform/ydb-slo-action/init@1cd8fe8433514e8b1e21461d5babb5169fb6460e
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workload_name: ${{ matrix.sdk.name }}
          workload_duration: '60'
          workload_current_ref: qa-${{ github.sha }}
          workload_current_image: ydb-app-current
          workload_current_command: >-
            run "Host=ydb;Port=2136;Database=/Root/testdb"
            --read-rps 100 --write-rps 25
            --read-timeout 10 --write-timeout 10
            --initial-data-count 100
          fail_on_workload_error: 'true'
          disable_compose_profiles: workload-baseline,chaos
