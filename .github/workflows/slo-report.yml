name: SLO Report

on:
  workflow_run:
    workflows: ["SLO", "SLO YDB Topics"]
    types:
      - completed

jobs:
  publish-slo-report:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    name: Publish YDB SLO Report
    concurrency:
      group: slo-report-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Publish YDB SLO Report
        uses: ydb-platform/ydb-slo-action/report@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_workflows: SLO,SLO YDB Topics
          remove_label: ${{ github.event.workflow_run.name == 'SLO' && 'SLO' || '' }}
