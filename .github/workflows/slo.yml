name: SLO

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

jobs:
  ydb-slo-action:
    if: contains(github.event.pull_request.labels.*.name, 'SLO')
    name: Run YDB SLO Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        workload:
          - name: AdoNet
          - name: Dapper
          - name: EF
          - name: Linq2db

    concurrency:
      group: slo-${{ github.ref }}-${{ matrix.workload.name }}
      cancel-in-progress: true

    steps:
      - name: Install dependencies
        run: |
          YQ_VERSION=v4.48.2
          BUILDX_VERSION=0.30.1
          COMPOSE_VERSION=2.40.3

          sudo curl -L https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64 -o /usr/local/bin/yq && \
            sudo chmod +x /usr/local/bin/yq

          echo "Updating Docker plugins..."
          sudo mkdir -p /usr/local/lib/docker/cli-plugins

          echo "Installing Docker Buildx ${BUILDX_VERSION}..."
          sudo curl -fLo /usr/local/lib/docker/cli-plugins/docker-buildx \
            "https://github.com/docker/buildx/releases/download/v${BUILDX_VERSION}/buildx-v${BUILDX_VERSION}.linux-amd64"
          sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx

          echo "Installing Docker Compose ${COMPOSE_VERSION}..."
          sudo curl -fLo /usr/local/lib/docker/cli-plugins/docker-compose \
            "https://github.com/docker/compose/releases/download/v${COMPOSE_VERSION}/docker-compose-linux-x86_64"
          sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

          echo "Installed versions:"
          yq --version
          docker --version
          docker buildx version
          docker compose version

      - name: Checkout current version
        uses: actions/checkout@v6
        with:
          path: current
          fetch-depth: 0

      - name: Build current workload image
        run: |
          set -euxo pipefail
          chmod +x current/.github/scripts/build-slo-image.sh

          current/.github/scripts/build-slo-image.sh \
            --tag "ydb-app-current" \
            --context "$GITHUB_WORKSPACE/current" \
            --workload "${{ matrix.workload.name }}"

      - name: Run YDB SLO
        uses: ydb-platform/ydb-slo-action/init@270f5e4250439544a6b0ccad33569cc4057c476e
        timeout-minutes: 30
        with:
          github_issue: ${{ github.event.inputs.github_issue }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workload_name: ${{ matrix.workload.name }}
          workload_duration: ${{ inputs.slo_workload_duration_seconds || '600' }}
          metrics_yaml: |
            metrics:
              - { name: ydb.topic.writer.written.messages, disabled: true }
              - { name: ydb.topic.reader.delivered.messages, disabled: true }
              - { name: ydb.topic.writer.message.ack.duration, disabled: true }
          fail_on_workload_error: true
          # Current-only until the baseline exports native SDK metrics for v3.
          workload_current_ref: ${{ github.head_ref || github.ref_name }}
          workload_current_image: ydb-app-current
          workload_current_command: >-
            run "Host=ydb;Port=2136;Database=/Root/testdb"
            --read-rps ${{ inputs.slo_workload_read_max_rps || '1000' }}
            --write-rps ${{ inputs.slo_workload_write_max_rps || '100' }}
            --read-timeout 1000
            --write-timeout 1000

  report:
    name: Table SLO graphs
    needs: ydb-slo-action
    if: ${{ !cancelled() && needs.ydb-slo-action.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: ydb-platform/ydb-slo-action/report@270f5e4250439544a6b0ccad33569cc4057c476e
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          post_comment: false
          github_run_id: ${{ github.run_id }}
