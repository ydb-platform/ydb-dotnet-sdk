name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
            config: .github/codeql/sdk.yml
          - language: actions
            build-mode: none
            config: .github/codeql/actions.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ${{ matrix.config }}

      - name: Build .NET SDK, examples and SLO workloads
        if: matrix.language == 'csharp'
        run: |
          dotnet build src/YdbSdk.sln --configuration Release --no-incremental
          dotnet build examples/YdbExamples.sln --configuration Release --no-incremental
          for project in slo/src/*/*.csproj; do
            dotnet build "$project" --configuration Release --no-incremental
          done

      - name: Analyze and upload results
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
